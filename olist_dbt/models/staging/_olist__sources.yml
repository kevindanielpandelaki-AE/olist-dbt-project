sources:
  - name: olist
    schema: olist_raw
    description: Brazilian E-Commerce Public Dataset by Olist
    tables:
      - name: olist_customers_dataset
        description: One record per customer_id. customer_id is generated per order; 
                    the same person is identified by customer_unique_id.
      - name: olist_orders_dataset
        description: >
          Raw order data from Olist Brazilian E-Commerce dataset (Kaggle, CC BY-NC-SA 4.0).
          Note: this is a static/historical snapshot (data ends ~Oct 2018), not a live-updating
          source. Source freshness checks below will always report as stale/error — this is
          expected, not a pipeline failure. Freshness is configured here to demonstrate
          understanding of the feature, not because it's operationally meaningful for this dataset.
        config:
          loaded_at_field: order_purchase_timestamp
          freshness:
            warn_after: {count: 90, period: day}
            error_after: {count: 180, period: day}
      - name: olist_order_items_dataset
        description: > 
          One record per item in an order. Each order can have 1 or more items. 
          The unique identifier per item is order_item_id, which is unique per order_id 
          (i.e. the same order_id can have multiple order_item_id values).
      - name: olist_order_payments_dataset
        description: >
          One record per payment for an order. Each order can have 1 or more payments. 
          The unique identifier per payment is payment_sequential, which is unique per order_id 
          (i.e. the same order_id can have multiple payment_sequential values).
      - name: olist_products_dataset
        description: >
          One record per product. Each product can be sold by 1 or more sellers. 
          The unique identifier per product is product_id.
      - name: olist_sellers_dataset
        description: >
          One record per seller. Each seller can sell 1 or more products. 
          The unique identifier per seller is seller_id.
      - name: olist_geolocation_dataset
        description: >
          One record per geolocation. Each geolocation can be associated with 1 or more zip codes. 
          The unique identifier per geolocation is geolocation_zip_code_prefix.
      - name: olist_order_reviews_dataset
        description: >
          One record per review for an order. Each order can have 0 or 1 reviews. 
          The unique identifier per review is review_id.
      - name: product_category_name_translation
        description: >
          One record per category name translation. Each category can have 1 or more translations. 
          The unique identifier per translation is category_name.
          